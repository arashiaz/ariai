name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      id: gradle
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-out.txt
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-log
        path: gradle-out.txt
        if-no-files-found: ignore
    - name: Post errors to issue
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        {
          echo "CI failed on \`$GITHUB_SHA\`"
          echo
          echo '```'
          grep -E "e: |FAILED|error:|Unresolved|SDK" gradle-out.txt | head -100 || tail -80 gradle-out.txt
          echo '```'
        } > /tmp/body.md
        gh issue create --title "ci-fail-$GITHUB_RUN_ID" --body-file /tmp/body.md || true
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AriAi-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
