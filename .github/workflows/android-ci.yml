name: Android CI

on:
  push:
    branches:
      - "arena/01a0b947-ariai"
  pull_request:
    branches:
      - "arena/01a0b947-ariai"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"

      - name: Locate Android project
        shell: bash
        run: |
          echo "Workspace:"
          pwd
          find . -maxdepth 4 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print
          echo "Gradle:"
          gradle --version

      - name: Lint
        run: gradle lintDebug --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Build release AAB
        run: gradle bundleRelease --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ariai-android-builds
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
            **/build/reports/lint-results-debug.html
          if-no-files-found: warn
