name: Android CI

on:
  push:
    branches:
      - "arena/01a0b947-ariai"
  pull_request:
    branches:
      - "arena/01a0b947-ariai"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect project
        shell: bash
        run: |
          set -euxo pipefail
          echo "PWD=$PWD"
          find . -maxdepth 5 -type f | sort | head -300
          echo "Gradle files:"
          find . -type f \( -name 'gradlew' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;34.0.4'

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "No Gradle wrapper found; installing Gradle 9.6."
            sudo apt-get update
            sudo apt-get install -y gradle
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Gradle version
        run: $GRADLE_CMD --version

      - name: Build debug
        run: $GRADLE_CMD assembleDebug --stacktrace --no-daemon

      - name: Unit tests
        run: $GRADLE_CMD testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: $GRADLE_CMD lintDebug --stacktrace --no-daemon

      - name: Build release APK
        run: $GRADLE_CMD assembleRelease --stacktrace --no-daemon

      - name: Build release AAB
        run: $GRADLE_CMD bundleRelease --stacktrace --no-daemon

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ariai-builds
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
            **/build/reports/**/*.html
          if-no-files-found: warn
